<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="OpsFlow 요청 등록" />
    <title>새 요청 | OpsFlow</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/new-request.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/">OpsFlow</a>
      <nav aria-label="주요 메뉴"><a class="nav-link active" href="/">요청</a></nav>
    </header>
    <main class="form-shell">
      <div class="form-heading">
        <a class="back-link" href="/">요청 목록</a>
        <h1>새 요청</h1>
        <p>처리가 필요한 운영 요청을 등록합니다.</p>
      </div>
      <form class="request-form" id="request-form" novalidate>
        <div class="form-field">
          <label for="title">제목 <span class="required-mark" aria-hidden="true">*</span></label>
          <input id="title" name="title" type="text" maxlength="100" required aria-describedby="title-error" />
          <p class="field-error" id="title-error" aria-live="polite"></p>
        </div>
        <div class="form-field">
          <label for="description">내용 <span class="required-mark" aria-hidden="true">*</span></label>
          <textarea id="description" name="description" maxlength="2000" required aria-describedby="description-error"></textarea>
          <p class="field-error" id="description-error" aria-live="polite"></p>
        </div>
        <div class="form-actions">
          <a class="secondary-action" href="/">취소</a>
          <button class="primary-action" type="submit">요청 등록</button>
        </div>
      </form>
    </main>
  </body>
</html>
