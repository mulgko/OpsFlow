<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="OpsFlow 요청 목록" />
    <title>요청 목록 | OpsFlow</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/requests-data.js" defer></script>
    <script src="/index.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/">OpsFlow</a>
      <nav aria-label="주요 메뉴"><a class="nav-link active" href="/">요청</a></nav>
    </header>
    <main>
      <div class="page-heading">
        <div><h1>요청 목록</h1><p>등록된 운영 요청을 확인합니다.</p></div>
        <a class="primary-action" href="/requests/new">새 요청</a>
      </div>
      <p class="success-notice" id="created-notice" role="status" hidden></p>
      <section class="request-panel" aria-labelledby="request-list-title">
        <div class="panel-header"><h2 id="request-list-title">전체 요청 <span id="request-count">-</span></h2></div>
        <div class="list-header" aria-hidden="true"><span>요청</span><span>담당자</span><span>상태</span><span>생성일</span></div>
        <div class="request-list" hidden></div>
        <div class="view-state loading-state" id="loading-state" role="status"><span class="loading-indicator" aria-hidden="true"></span><p>요청을 불러오는 중입니다.</p></div>
        <div class="view-state empty-state" id="empty-state" hidden><h2>등록된 요청이 없습니다</h2><p>새 요청을 등록하면 이곳에 표시됩니다.</p><a class="secondary-action" href="/requests/new">새 요청 등록</a></div>
        <div class="view-state error-state" id="error-state" role="alert" hidden><h2>요청을 불러오지 못했습니다</h2><p>저장된 데이터가 올바르지 않습니다. 데이터를 초기화한 뒤 다시 시도해 주세요.</p><button class="secondary-action" id="reset-requests" type="button">데이터 초기화</button></div>
      </section>
    </main>
  </body>
</html>
