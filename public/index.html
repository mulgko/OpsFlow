<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="운영 요청을 하나의 흐름으로 관리하는 OpsFlow" />
    <title>OpsFlow</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <p class="eyebrow">OPSFLOW</p>
      <h1>운영 업무를<br />한 흐름으로.</h1>
      <p class="description">요청 접수부터 진행, 검토, 완료까지 한곳에서 관리하세요.</p>
      <div class="flow" aria-label="기본 업무 흐름">
        <span>접수</span><i>→</i><span>진행</span><i>→</i><span>검토</span><i>→</i><span>완료</span>
      </div>
    </main>
  </body>
</html>
